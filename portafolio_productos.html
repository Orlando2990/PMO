<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ORBITA - Portafolio de Productos</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="css/pmo-layout.css">
<style>.product-card{transition:.18s}.product-card:hover{transform:translateY(-2px);box-shadow:0 16px 35px #0f172a17}.health-dot{width:9px;height:9px;border-radius:999px;display:inline-block}.detail-row{display:grid;grid-template-columns:minmax(260px,2fr) 115px 140px 125px 120px 84px;gap:12px;align-items:center}@media(max-width:950px){.detail-row{grid-template-columns:1fr 105px 84px}.detail-hide{display:none}}.modalx{position:fixed;inset:0;background:#0f172a99;display:flex;align-items:center;justify-content:center;padding:18px;z-index:120}.modalx.hidden{display:none}</style></head>
<body class="bg-slate-50/60 text-slate-800 antialiased"><div id="pmo-app-header" data-pmo-module="portafolio"></div><main class="max-w-7xl mx-auto px-6 py-8 space-y-7">
<section class="relative overflow-hidden bg-slate-950 rounded-3xl p-7 text-white shadow-xl"><div class="absolute -right-20 -top-24 w-72 h-72 rounded-full bg-blue-500/20 blur-3xl"></div><div class="relative z-10 flex flex-col xl:flex-row xl:items-center xl:justify-between gap-6"><div><h1 class="text-3xl md:text-4xl font-black tracking-tight">Portafolio de Productos</h1></div><div class="flex flex-col sm:flex-row gap-3"><select id="filter-system" onchange="PMOPortfolio.render()" class="bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm font-bold min-w-48"><option value="">Todos los sistemas</option></select><button data-pmo-write onclick="PMOPortfolio.newFollowup()" class="bg-blue-600 hover:bg-blue-500 text-white rounded-xl px-4 py-3 text-sm font-black inline-flex items-center justify-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Nuevo seguimiento</button></div></div></section>
<div id="portfolio-error" class="hidden bg-rose-50 border border-rose-200 text-rose-800 rounded-2xl p-4 text-sm"></div><section id="global-kpis" class="pmo-ytd-panel" aria-label="Resumen del Portafolio"></section>
<section class="grid grid-cols-1 xl:grid-cols-[1.15fr_.85fr] gap-6"><div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6"><div class="flex items-center justify-between gap-3 mb-5"><div><h2 class="text-lg font-black text-slate-950">Sistemas y productos</h2></div><div class="bg-blue-50 text-blue-700 rounded-xl p-2.5"><i data-lucide="network" class="w-5 h-5"></i></div></div><div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div></div><div id="executive-panel" class="bg-slate-950 rounded-3xl shadow-xl p-6 text-white min-h-[420px]"></div></section>
<section class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden"><div class="p-6 border-b border-slate-100 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4"><div><h2 class="text-lg font-black text-slate-950">Seguimientos del producto</h2><p id="follow-subtitle" class="text-xs text-slate-500 mt-1">Selecciona un producto.</p></div><div class="flex flex-wrap gap-2"><select id="filter-type" onchange="PMOPortfolio.renderFollowups()" class="border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold bg-white"><option value="">Todos los tipos</option></select><select id="filter-status" onchange="PMOPortfolio.renderFollowups()" class="border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold bg-white"><option value="">Todos los estatus</option></select></div></div><div class="p-4"><div class="detail-row px-4 py-2 text-[10px] uppercase tracking-wide font-black text-slate-400"><span>Seguimiento</span><span>Tipo</span><span class="detail-hide">Responsable</span><span class="detail-hide">Compromiso</span><span>Estado</span><span></span></div><div id="follow-list" class="divide-y divide-slate-100"></div></div></section>
</main>
<div id="portfolio-modal" class="modalx hidden"><div class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl max-h-[92vh] overflow-auto"><div class="p-5 border-b flex items-start justify-between gap-3"><div><p id="modal-kicker" class="text-[10px] font-black uppercase tracking-widest text-blue-600">Portafolio</p><h3 id="modal-title" class="text-xl font-black text-slate-950 mt-1">Nuevo seguimiento</h3></div><button onclick="PMOPortfolio.closeModal()" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-500">✕</button></div><form id="portfolio-form" onsubmit="PMOPortfolio.save(event)" class="p-5 space-y-4"><input id="f-id" type="hidden"><div class="grid md:grid-cols-2 gap-4"><label class="text-xs font-black">Producto<select id="f-product" required class="mt-1 w-full border border-slate-200 rounded-xl p-3 font-normal bg-white"></select></label><label class="text-xs font-black">Título<input id="f-title" required maxlength="180" class="mt-1 w-full border border-slate-200 rounded-xl p-3 font-normal"></label></div><label class="text-xs font-black block">Descripción<textarea id="f-desc" rows="3" class="mt-1 w-full border border-slate-200 rounded-xl p-3 font-normal"></textarea></label><div class="grid md:grid-cols-3 gap-4"><label class="text-xs font-black">Tipo<select id="f-type" required class="mt-1 w-full border border-slate-200 rounded-xl p-3 font-normal bg-white"></select></label><label class="text-xs font-black">Estatus<select id="f-status" required class="mt-1 w-full border border-slate-200 rounded-xl p-3 font-normal bg-white"></select></label><label class="text-xs font-black">Prioridad<select id="f-priority" required class="mt-1 w-full border border-slate-200 rounded-xl p-3 font-normal bg-white"></select></label></div><div class="grid md:grid-cols-3 gap-4"><label class="text-xs font-black">Responsable<input id="f-owner" class="mt-1 w-full border border-slate-200 rounded-xl p-3 font-normal"></label><label class="text-xs font-black">Fecha compromiso<input id="f-date" type="date" class="mt-1 w-full border border-slate-200 rounded-xl p-3 font-normal"></label><label class="text-xs font-black">RQM relacionado (opcional)<select id="f-rqm" class="mt-1 w-full border border-slate-200 rounded-xl p-3 font-normal bg-white"><option value="">Sin relación</option></select></label></div><div class="flex justify-end gap-2 pt-2"><button type="button" onclick="PMOPortfolio.closeModal()" class="bg-slate-100 text-slate-700 rounded-xl px-5 py-3 text-sm font-black">Cancelar</button><button id="save-follow" type="submit" class="bg-blue-600 text-white rounded-xl px-5 py-3 text-sm font-black inline-flex items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Guardar</button></div></form></div></div>
<script src="js/pmo-auth.js"></script><script src="js/pmo-layout.js"></script><script src="js/pmo-dialogs.js"></script><script src="js/pmo-portfolio.js"></script></body></html>
