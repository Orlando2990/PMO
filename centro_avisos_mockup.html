<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORBITA | Centro de Avisos</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="css/pmo-layout.css"><style>.panel{background:white;border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 4px 16px #0f172a08}.chip{font-size:11px;font-weight:800;border-radius:999px;padding:5px 10px}.btn{border-radius:12px;padding:10px 14px;font-size:12px;font-weight:800}.field{width:100%;border:1px solid #dbe3ef;border-radius:12px;padding:10px 12px;font-size:13px;background:white}.overlay{position:fixed;inset:0;background:#020617a8;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}.overlay.hidden{display:none}#noticeForm .field{padding:12px 14px;border-radius:13px;min-height:44px;background:#fff}#noticeForm label{color:#18233a}#noticeForm .form-panel{background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:17px}#noticeForm .action-footer{position:sticky;bottom:-28px;background:#fff;border-top:1px solid #e2e8f0;margin:15px -28px -28px;padding:16px 28px;z-index:2}#cards>button{background:#fff;box-shadow:0 3px 10px #0f172a08;transition:transform .2s,box-shadow .2s}#cards>button:hover{transform:translateY(-2px);box-shadow:0 12px 28px #0f172a15}#stats>div:not(:last-child){border-right:0}#stats>div{padding:9px 5px}#stats .stat-number{font-size:29px;font-weight:900;color:#f15b50}#stats .stat-title{font-size:11px;text-transform:uppercase;color:#64748b;font-weight:800}</style></head><body class="bg-slate-50 text-slate-900"><div id="pmo-app-header" data-pmo-module="avisos"></div><main class="max-w-[1440px] mx-auto px-5 py-7 space-y-5"><section class="rounded-3xl bg-gradient-to-r from-[#0b173a] to-[#103d66] text-white p-7 flex flex-wrap justify-between gap-4 items-center"><div><h1 class="text-3xl font-black">Centro de Avisos</h1></div><button id="newNoticeButton" onclick="showForm()" class="btn bg-white text-slate-900 flex gap-2 items-center"><i data-lucide="plus" class="w-4 h-4"></i> Nuevo aviso</button></section><section class="panel p-4 flex flex-wrap items-center justify-between gap-3" id="demoSwitcher" style="display:none"><div><div class="text-sm font-black">Vista de demostración</div><div class="text-xs text-slate-500">Alterna entre perfiles sin cambiar de sesión. No modifica permisos reales.</div></div><div class="inline-flex rounded-xl bg-slate-100 p-1 gap-1"><button id="demoAdmin" onclick="setDemoRole('admin')" class="btn bg-slate-900 text-white">Administrador</button><button id="demoUser" onclick="setDemoRole('user')" class="btn bg-transparent text-slate-600">Usuario normal</button></div></section><section class="panel p-5" id="statsShell"><div class="flex items-center justify-between pb-3 mb-3"><h2 class="text-xl font-black text-[#0b173a]">Resumen de avisos</h2></div><div class="h-[3px] rounded-full bg-gradient-to-r from-orange-500 via-blue-500 to-blue-700 mb-5"></div><div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center" id="stats"></div></section><section class="grid xl:grid-cols-[1.8fr_1fr] gap-5"><div class="panel p-5"><div class="flex flex-wrap justify-between gap-3 items-center mb-5"><h2 class="font-black text-lg">Comunicados publicados</h2><div class="flex gap-2 flex-wrap"><button class="btn bg-slate-900 text-white" onclick="filter='todos';render()">Todos</button><button class="btn bg-blue-50 text-blue-700" onclick="filter='nuevos';render()">Sin leer</button><button class="btn bg-orange-50 text-orange-700" onclick="filter='importantes';render()">Importantes</button></div></div><input id="search" class="field mb-4" oninput="render()" placeholder="Buscar por título, contenido o categoría..."><div id="cards" class="grid sm:grid-cols-2 gap-4"></div></div><aside id="adminAside" class="space-y-5"><div class="panel p-5"><h2 class="font-black">Administración de avisos</h2><div id="admin" class="mt-4 space-y-3"></div></div></aside></section></main><div id="modal" class="overlay hidden"><div class="bg-white rounded-[26px] shadow-2xl max-w-[760px] w-full max-h-[90vh] flex flex-col overflow-hidden border border-slate-200"><div class="px-7 py-5 border-b border-slate-200 flex justify-between items-center shrink-0 bg-white"><div class="flex gap-3 items-center"><span class="rounded-xl bg-blue-50 p-2 text-blue-700"><i data-lucide="megaphone" class="w-5 h-5"></i></span><div><h3 id="modalTitle" class="text-lg font-black text-slate-900">Nuevo aviso</h3></div></div><button type="button" onclick="closeModal()" class="p-3 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-600" aria-label="Cerrar"><i data-lucide="x" class="w-5 h-5"></i></button></div><div id="modalBody" class="p-7 overflow-y-auto"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/pmo-auth.js"></script><script src="js/pmo-dialogs.js"></script><script src="js/orbita-avisos.js"></script><script src="js/pmo-layout.js"></script></body></html>
